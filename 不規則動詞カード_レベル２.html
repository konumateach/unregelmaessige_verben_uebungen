<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドイツ語 不規則変化動詞カード（レベル２）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1B2624; --muted:#5E6B68; --line:#D5DDDA;
  --green:#2F8F5B; --green-ink:#FFFFFF; --green-soft:#E3F2E9;
  --accent:#23566B; --accent-soft:#E2EDF1; --revealed:#FFF4D6; --revealed-line:#E5C66E;
  --jp:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --de:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121917; --surface:#1B2421; --ink:#E6EDEA; --muted:#98A6A2; --line:#2F3B38;
    --green:#3FA86F; --green-ink:#0D1411; --green-soft:#1F3328;
    --accent:#7FB8CC; --accent-soft:#1D2E35; --revealed:#3A3220; --revealed-line:#8C7536;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121917; --surface:#1B2421; --ink:#E6EDEA; --muted:#98A6A2; --line:#2F3B38;
  --green:#3FA86F; --green-ink:#0D1411; --green-soft:#1F3328;
  --accent:#7FB8CC; --accent-soft:#1D2E35; --revealed:#3A3220; --revealed-line:#8C7536;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}

.tabs{display:flex;border-bottom:2px solid var(--line);gap:4px;overflow-x:auto}
.tab{font:inherit;font-size:15px;background:none;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-weight:700}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

.levels{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.levels .lab{color:var(--muted);font-size:13px;margin-right:4px}
.lv{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.lvnote{color:var(--muted);font-size:12.5px;width:100%}

.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.group{font-family:"Atkinson Hyperlegible","BIZ UDPGothic",sans-serif;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:6px;font-size:15px}
.count{font-family:var(--de);color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}

.stage{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.arrow{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer;display:grid;place-items:center;line-height:1}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-height:108px}
.cell .h{font-size:12px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}
.cell .v{flex:1;display:grid;place-items:center;padding:10px 6px;font-family:var(--de);font-size:clamp(17px,2.6vw,22px);font-weight:700;text-align:center;overflow-wrap:anywhere}
.cell .v.jp{font-family:var(--jp);font-size:clamp(15px,2.2vw,18px)}
.cell button.v{border:none;font:inherit;font-family:var(--de);font-size:32px;font-weight:700;background:var(--green);color:var(--green-ink);cursor:pointer;width:100%}
.cell button.v:hover{filter:brightness(1.07)}
.cell.shown{background:var(--revealed);border-color:var(--revealed-line)}

.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink);font-weight:700}
.hint{color:var(--muted);font-size:12.5px;text-align:center}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (max-width:600px){
  .cells{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arrow{width:40px;height:40px;font-size:18px}
  .stage{gap:6px}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>ドイツ語 不規則変化動詞カード（レベル２）</h1>
    <p class="sub">テスト範囲 63語・緑の「？」を押すと答えが出ます</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="並び方">
    <button class="tab" role="tab" id="tab-alpha" data-order="alpha">アルファベット順</button>
    <button class="tab" role="tab" id="tab-group" data-order="group">グループ分け</button>
    <button class="tab" role="tab" id="tab-random" data-order="random">ランダム</button>
  </nav>

  <div class="levels" role="group" aria-label="難しさ">
    <span class="lab">難しさ</span>
    <button class="lv" id="lv-easy" data-level="easy">簡単</button>
    <button class="lv" id="lv-normal" data-level="normal">ふつう</button>
    <button class="lv" id="lv-hard" data-level="hard">難しい</button>
    <span class="lvnote" id="lvnote"></span>
  </div>

  <div class="meta">
    <span class="group" id="group" hidden></span>
    <span class="count" id="count"></span>
  </div>

  <div class="stage">
    <button class="arrow" id="prev" aria-label="前の動詞">◀</button>
    <div class="cells" id="cells"></div>
    <button class="arrow" id="next" aria-label="次の動詞">▶</button>
  </div>

  <div class="actions">
    <button class="btn primary" id="reshuffle">隠す場所を変える</button>
    <button class="btn" id="showall">答えをすべて見る</button>
    <button class="btn" id="reorder" hidden>並びをシャッフルし直す</button>
  </div>
  <p class="hint">キーボードの ← → で前後に移動、Enter で答えをすべて表示できます</p>
</div>

<script>
// [不定形, 過去基本形, 過去分詞, 日本語]
const V = {
  "fahren":["fahren", "fuhr", "gefahren", "(乗り物で)行く"],
  "schlagen":["schlagen", "schlug", "geschlagen", "打つ"],
  "tragen":["tragen", "trug", "getragen", "運ぶ"],
  "laden":["laden", "lud", "geladen", "積む"],
  "fallen":["fallen", "fiel", "gefallen", "落ちる"],
  "fangen":["fangen", "fing", "gefangen", "捕まえる"],
  "halten":["halten", "hielt", "gehalten", "保つ、止まる"],
  "lassen":["lassen", "ließ", "gelassen", "～させる"],
  "laufen":["laufen", "lief", "gelaufen", "走る"],
  "raten":["raten", "riet", "geraten", "助言する"],
  "schlafen":["schlafen", "schlief", "geschlafen", "眠る"],
  "essen":["essen", "aß", "gegessen", "食べる"],
  "geben":["geben", "gab", "gegeben", "与える"],
  "lesen":["lesen", "las", "gelesen", "読む"],
  "messen":["messen", "maß", "gemessen", "測る"],
  "sehen":["sehen", "sah", "gesehen", "見る"],
  "treten":["treten", "trat", "getreten", "踏む"],
  "vergessen":["vergessen", "vergaß", "vergessen", "忘れる"],
  "helfen":["helfen", "half", "geholfen", "助ける"],
  "nehmen":["nehmen", "nahm", "genommen", "取る"],
  "sprechen":["sprechen", "sprach", "gesprochen", "話す"],
  "treffen":["treffen", "traf", "getroffen", "会う"],
  "brechen":["brechen", "brach", "gebrochen", "折る"],
  "beginnen":["beginnen", "begann", "begonnen", "始める"],
  "gewinnen":["gewinnen", "gewann", "gewonnen", "勝つ"],
  "schwimmen":["schwimmen", "schwamm", "geschwommen", "泳ぐ"],
  "binden":["binden", "band", "gebunden", "結ぶ"],
  "finden":["finden", "fand", "gefunden", "見つける"],
  "singen":["singen", "sang", "gesungen", "歌う"],
  "springen":["springen", "sprang", "gesprungen", "跳ぶ"],
  "trinken":["trinken", "trank", "getrunken", "飲む"],
  "liegen":["liegen", "lag", "gelegen", "横たわっている"],
  "sitzen":["sitzen", "saß", "gesessen", "座っている"],
  "bitten":["bitten", "bat", "gebeten", "頼む"],
  "bleiben":["bleiben", "blieb", "geblieben", "とどまる"],
  "leihen":["leihen", "lieh", "geliehen", "貸す"],
  "scheinen":["scheinen", "schien", "geschienen", "輝く、～のように見える"],
  "schreiben":["schreiben", "schrieb", "geschrieben", "書く"],
  "steigen":["steigen", "stieg", "gestiegen", "登る"],
  "weisen":["weisen", "wies", "gewiesen", "指し示す"],
  "bieten":["bieten", "bot", "geboten", "提供する"],
  "fliegen":["fliegen", "flog", "geflogen", "飛ぶ"],
  "fliehen":["fliehen", "floh", "geflohen", "逃げる"],
  "ziehen":["ziehen", "zog", "gezogen", "引く"],
  "genießen":["genießen", "genoss", "genossen", "楽しむ"],
  "gießen":["gießen", "goss", "gegossen", "注ぐ"],
  "schießen":["schießen", "schoss", "geschossen", "撃つ"],
  "gehen":["gehen", "ging", "gegangen", "行く"],
  "haben":["haben", "hatte", "gehabt", "持っている"],
  "kommen":["kommen", "kam", "gekommen", "来る"],
  "sein":["sein", "war", "gewesen", "～である"],
  "stehen":["stehen", "stand", "gestanden", "立っている"],
  "tun":["tun", "tat", "getan", "する"],
  "werden":["werden", "wurde", "geworden", "～になる"],
  "bringen":["bringen", "brachte", "gebracht", "持って来る"],
  "denken":["denken", "dachte", "gedacht", "考える"],
  "kennen":["kennen", "kannte", "gekannt", "(体験して)知っている"],
  "nennen":["nennen", "nannte", "genannt", "名付ける"],
  "rennen":["rennen", "rannte", "gerannt", "駆ける"],
  "brennen":["brennen", "brannte", "gebrannt", "燃える"],
  "senden":["senden", "sandte", "gesandt", "送る"],
  "wenden":["wenden", "wandte", "gewandt", "向ける"],
  "wissen":["wissen", "wusste", "gewusst", "(知識として)知っている"]
};
// アルファベット順(docxのグループ一覧を並べ替え)
const ALPHA = ["beginnen", "bieten", "binden", "bitten", "bleiben", "brechen", "brennen", "bringen", "denken", "essen", "fahren", "fallen", "fangen", "finden", "fliegen", "fliehen", "geben", "gehen", "genießen", "gewinnen", "gießen", "haben", "halten", "helfen", "kennen", "kommen", "laden", "lassen", "laufen", "leihen", "lesen", "liegen", "messen", "nehmen", "nennen", "raten", "rennen", "scheinen", "schießen", "schlafen", "schlagen", "schreiben", "schwimmen", "sehen", "sein", "senden", "singen", "sitzen", "sprechen", "springen", "stehen", "steigen", "tragen", "treffen", "treten", "trinken", "tun", "vergessen", "weisen", "wenden", "werden", "wissen", "ziehen"];
// docxのグループ(上から順)
const GROUPS = [
  ["a → u → a", ["fahren", "schlagen", "tragen", "laden"]],
  ["a → ie/i → a", ["fallen", "fangen", "halten", "lassen", "laufen", "raten", "schlafen"]],
  ["e → a → e", ["essen", "geben", "lesen", "messen", "sehen", "treten", "vergessen"]],
  ["e → a → o", ["helfen", "nehmen", "sprechen", "treffen", "brechen"]],
  ["i → a → o", ["beginnen", "gewinnen", "schwimmen"]],
  ["i → a → u", ["binden", "finden", "singen", "springen", "trinken"]],
  ["ie/i → a → e", ["liegen", "sitzen", "bitten"]],
  ["ei → ie → ie", ["bleiben", "leihen", "scheinen", "schreiben", "steigen", "weisen"]],
  ["ie → o → o", ["bieten", "fliegen", "fliehen", "ziehen", "genießen", "gießen", "schießen"]],
  ["特殊型", ["gehen", "haben", "kommen", "sein", "stehen", "tun", "werden"]],
  ["混合変化", ["bringen", "denken", "kennen", "nennen", "rennen", "brennen", "senden", "wenden", "wissen"]]
];
const GROUP_OF = {}; const GROUP_ORDER = [];
GROUPS.forEach(([name, vs]) => vs.forEach(v => { GROUP_OF[v] = name; GROUP_ORDER.push(v); }));

const HEAD = ["日本語","不定形","過去基本形","過去分詞"]; // 表示順
const LEVELS = {
  easy:   {pool:[2,3],   n:1, note:"日本語と不定形は常に表示。過去基本形か過去分詞のどちらか1か所を隠します。"},
  normal: {pool:[1,2,3], n:2, note:"日本語は常に表示。不定形・過去基本形・過去分詞のうち2か所を隠します。"},
  hard:   {pool:[0,1,2,3], n:2, note:"日本語も含めた4か所のうち2か所を隠します。"}
};

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let order = store.get("vk2-order") || "alpha";
let level = store.get("vk2-level") || "easy";
if(!["alpha","group","random"].includes(order)) order = "alpha";
if(!LEVELS[level]) level = "easy";
let randomList = shuffle(ALPHA.slice());
let idx = 0, hidden = new Set(), shown = new Set();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function list(){ return order==="alpha" ? ALPHA : order==="group" ? GROUP_ORDER : randomList; }
function pickHidden(){
  const L = LEVELS[level];
  hidden = new Set(shuffle(L.pool.slice()).slice(0, L.n));
  shown = new Set();
}
function cellValues(key){ const [inf,past,pp,jp] = V[key]; return [jp,inf,past,pp]; }

function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.order===order));
  document.querySelectorAll(".lv").forEach(b => b.setAttribute("aria-pressed", b.dataset.level===level));
  document.getElementById("lvnote").textContent = LEVELS[level].note;
  document.getElementById("reorder").hidden = order!=="random";

  const arr = list(), key = arr[idx], vals = cellValues(key);
  const g = document.getElementById("group");
  g.hidden = order!=="group";
  if(order==="group"){
    g.textContent = GROUP_OF[key];
  }
  document.getElementById("count").textContent = `${idx+1} / ${arr.length}`;

  const box = document.getElementById("cells"); box.innerHTML = "";
  vals.forEach((val,i) => {
    const c = document.createElement("div"); c.className = "cell";
    const h = document.createElement("div"); h.className = "h"; h.textContent = HEAD[i]; c.appendChild(h);
    if(hidden.has(i) && !shown.has(i)){
      const b = document.createElement("button"); b.className = "v"; b.textContent = "？";
      b.setAttribute("aria-label", HEAD[i]+"を表示");
      b.addEventListener("click", () => { shown.add(i); render(); });
      c.appendChild(b);
    } else {
      if(hidden.has(i)) c.classList.add("shown");
      const v = document.createElement("div"); v.className = "v" + (i===0 ? " jp" : ""); v.textContent = val;
      if(i!==0) v.lang = "de";
      c.appendChild(v);
    }
    box.appendChild(c);
  });
}
function go(d){ const n = list().length; idx = (idx + d + n) % n; pickHidden(); render(); }

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  if(t.dataset.order==="random" && order!=="random") randomList = shuffle(ALPHA.slice());
  order = t.dataset.order; store.set("vk2-order", order); idx = 0; pickHidden(); render();
}));
document.querySelectorAll(".lv").forEach(b => b.addEventListener("click", () => {
  level = b.dataset.level; store.set("vk2-level", level); pickHidden(); render();
}));
document.getElementById("prev").addEventListener("click", () => go(-1));
document.getElementById("next").addEventListener("click", () => go(1));
document.getElementById("reshuffle").addEventListener("click", () => { pickHidden(); render(); });
document.getElementById("showall").addEventListener("click", () => { hidden.forEach(i => shown.add(i)); render(); });
document.getElementById("reorder").addEventListener("click", () => { randomList = shuffle(ALPHA.slice()); idx = 0; pickHidden(); render(); });
document.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="Enter"){
    e.preventDefault(); hidden.forEach(i => shown.add(i)); render();
  }
});

pickHidden(); render();
</script>
</body>
</html>
